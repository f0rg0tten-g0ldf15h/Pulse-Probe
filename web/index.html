<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseProbe — System & API Uptime Monitor</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- Google Font for sleek developer aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation -->
        <header class="navbar">
            <div class="logo-group">
                <span class="pulse-dot"></span>
                <h1>PulseProbe</h1>
                <span class="badge">LIVE</span>
            </div>
            <button id="open-modal-btn" class="btn btn-primary">+ Add Monitor</button>
        </header>

        <!-- Top Metrics Overview -->
        <section class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Monitors</span>
                <span id="stat-total" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Operational (UP)</span>
                <span id="stat-up" class="stat-value text-success">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Degraded (DOWN)</span>
                <span id="stat-down" class="stat-value text-danger">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Avg Response Latency</span>
                <span id="stat-latency" class="stat-value">0 ms</span>
            </div>
        </section>

        <!-- Monitors Grid Container -->
        <main>
            <div class="section-header">
                <h2>Monitored Services</h2>
                <span id="last-updated" class="text-muted">Connecting...</span>
            </div>
            <div id="monitors-container" class="monitors-grid">
                <!-- Dynamically populated by app.js -->
            </div>
        </main>
    </div>

    <!-- Add Monitor Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Endpoint Monitor</h3>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <form id="add-monitor-form">
                <div class="form-group">
                    <label for="monitor-name">Service / API Name</label>
                    <input type="text" id="monitor-name" placeholder="e.g. Production Auth Gateway" required>
                </div>
                <div class="form-group">
                    <label for="monitor-url">Target Endpoint URL</label>
                    <input type="url" id="monitor-url" placeholder="https://api.example.com/health" required>
                </div>
                <div class="form-group">
                    <label for="monitor-interval">Check Interval (seconds)</label>
                    <input type="number" id="monitor-interval" min="5" max="3600" value="10" required>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Monitor</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/chart.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
